<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBC6521 Project Allocation</title>
<style>
  body { margin: 0; padding: 24px; background: #fff; color: #000;
         font: 16px/21px "Aptos Narrow", Aptos, "Arial Narrow", Arial, sans-serif; }
  #status { width: 1130px; max-width: 100%; margin: 0 auto 8px; font: 12px/16px Arial, sans-serif; color: #555; }
  #status.error { color: #a00000; }
  table { width: 1130px; margin: 0 auto; border-collapse: collapse; table-layout: fixed; }
  col:nth-child(1) { width: 100px; }
  col:nth-child(2) { width: 175px; }
  col:nth-child(3) { width: 690px; }
  col:nth-child(4) { width: 165px; }
  th, td { border: 1px solid #777; padding: 0 5px; text-align: left;
           vertical-align: middle; overflow-wrap: anywhere; }
  th { font-weight: 700; }
</style>
</head>
<body>
<p id="status" role="status">Loading allocation results...</p>
<table>
  <colgroup><col><col><col><col></colgroup>
  <thead><tr><th scope="col">Index Number</th><th scope="col">Project ID</th><th scope="col">Project Title</th><th scope="col">Allocated to (BUPT no.)</th></tr></thead>
  <tbody></tbody>
</table>
<script>
  const source = 'https://raw.githubusercontent.com/YixuanZouQMUL/bbc6521-allocation-live/main/';
  const status = document.getElementById('status');
  let displayedVersion = null;
  let checking = false;

  async function loadLatest() {
    if (checking) return;
    checking = true;
    try {
      const nonce = Date.now();
      const versionResponse = await fetch(source + 'version.txt?t=' + nonce, { cache: 'no-store' });
      if (!versionResponse.ok) throw new Error('Version request failed');
      const version = (await versionResponse.text()).trim();
      if (!/^[a-f0-9]{64}$/.test(version)) throw new Error('Invalid version');
      if (version !== displayedVersion) {
        const pageResponse = await fetch(source + 'index.html?t=' + nonce, { cache: 'no-store' });
        if (!pageResponse.ok) throw new Error('Data request failed');
        const html = await pageResponse.text();
        const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(html));
        const actualVersion = [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2, '0')).join('');
        if (actualVersion !== version) throw new Error('Data and version do not match yet');
        const documentFromSource = new DOMParser().parseFromString(html, 'text/html');
        const rows = documentFromSource.querySelectorAll('tbody tr');
        if (rows.length === 0 || [...rows].some(row => row.cells.length !== 4)) {
          throw new Error('Invalid allocation table');
        }
        document.querySelector('tbody').replaceChildren(...[...rows].map(row => row.cloneNode(true)));
        displayedVersion = version;
      }
      status.classList.remove('error');
      status.textContent = 'Checked: ' + new Date().toLocaleTimeString();
    } catch (error) {
      status.classList.add('error');
      status.textContent = displayedVersion === null
        ? 'Unable to load allocation results. Please try again later.'
        : 'Unable to check for updates. Showing the last loaded results.';
    } finally {
      checking = false;
    }
  }

  loadLatest();
  setInterval(loadLatest, 10000);
</script>
</body>
</html>
